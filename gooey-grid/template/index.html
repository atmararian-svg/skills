<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gooey Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Starter for the gooey dot-grid effect: full-bleed WebGL2 canvas + one floating glass control module.
   Retheme by editing the tokens and PALETTES; the panel components are self-contained (.module ...). */
:root{
  --bg:#1f2a44; --fg:#ffb38a;                 /* canvas colours, set from the active palette */
  --accent:#ffb38a; --accent-ink:#1f2a44;     /* pressed chips, fader fill, switch on */
  --glass:rgba(244,244,242,.7); --panel:#f4f4f2;
  --ink:#2c2c2b; --ink-soft:#6b6f6e; --line:rgba(44,44,43,.14);
  --f-ui:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px var(--f-ui);overflow:hidden}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#stage.erasing{cursor:cell}

/* ---- Glass module ---- */
.module{position:fixed;z-index:5;top:16px;left:16px;width:292px;max-height:calc(100% - 32px);overflow:auto;
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  border:1px solid rgba(255,255,255,.45);border-radius:18px;box-shadow:0 18px 50px -24px rgba(20,26,27,.55)}
.module-head{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;flex:1;min-width:0}
.brand b{font-weight:500;font-size:19px;letter-spacing:-.02em;line-height:1.05}
.brand span,.label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}
.collapse{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;height:30px;
  padding:0 12px;font:500 12px var(--f-ui);cursor:pointer}
.module-body{display:flex;flex-direction:column;gap:18px;padding:16px}
.module.closed .module-body{display:none}
.module.closed .module-head{border-bottom:0}
.group{display:flex;flex-direction:column;gap:10px}
.label{display:flex;justify-content:space-between;align-items:baseline}
.group > .label:first-child{color:var(--ink);font-weight:500}
.label output{color:var(--ink);font-variant-numeric:tabular-nums}

.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.swatch{appearance:none;border:1px solid var(--line);border-radius:10px;aspect-ratio:5/3;cursor:pointer;padding:0;
  display:grid;place-items:center;background:var(--sbg)}
.swatch::after{content:"";height:44%;aspect-ratio:1;border-radius:50%;background:var(--sfg)}
.swatch[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}

.fader{display:flex;flex-direction:column;gap:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--accent-ink) var(--p,50%),var(--line) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--accent-ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--accent);border:2px solid var(--accent-ink)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--accent-ink)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(44,44,43,.06);border-radius:10px;padding:3px;gap:3px}
.seg button,.btn{appearance:none;border:0;font:500 13px var(--f-ui);color:var(--ink);cursor:pointer;border-radius:8px;height:32px}
.seg button{background:transparent}
.seg button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;height:30px;
  font:500 12.5px var(--f-ui);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid var(--accent-ink);box-sizing:border-box}
.chip[aria-pressed="true"]{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.chip[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}

.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px}
.switch{appearance:none;width:40px;height:22px;border-radius:999px;background:rgba(44,44,43,.18);position:relative;cursor:pointer;border:0;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .18s}
.switch[aria-checked="true"]{background:var(--accent-ink)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--accent)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.btn{background:rgba(44,44,43,.06);padding:0 10px}
.btn:hover{background:rgba(44,44,43,.11)}
.hint{font-size:12.5px;line-height:1.45;color:var(--ink-soft);margin:0}
.hint kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.readout{position:fixed;right:16px;bottom:14px;font:11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;
  color:var(--fg);opacity:.75;pointer-events:none;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.switch::after{transition:none}}
@media (max-width:640px){.module{left:12px;right:12px;top:12px;width:auto;max-height:72%}}
</style>
</head>
<body>
<canvas id="stage" aria-label="Dot grid. Hover to merge dots, click for a ripple, drag to draw links."></canvas>

<section class="module" id="module" aria-label="Controls">
  <header class="module-head">
    <div class="brand"><b>Gooey Grid</b><span>Starter</span></div>
    <button class="collapse" id="collapse" aria-expanded="true" aria-controls="moduleBody">Hide</button>
  </header>
  <div class="module-body" id="moduleBody">
    <div class="group">
      <div class="label">Palette <output id="palName"></output></div>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="group">
      <div class="label">Effects</div>
      <div class="chips" role="group" aria-label="Effects">
        <button class="chip" data-fx="magnet">Magnet</button>
        <button class="chip" data-fx="ripples">Ripples</button>
        <button class="chip" data-fx="breathe">Breathe</button>
      </div>
    </div>
    <div class="group">
      <div class="label">Cursor</div>
      <div class="fader"><div class="label"><label for="fReach">Reach</label><output id="oReach"></output></div>
        <input type="range" id="fReach" min="0.6" max="6" step="0.1" value="2.2"></div>
      <div class="fader"><div class="label"><label for="fSmooth">Smoothing</label><output id="oSmooth"></output></div>
        <input type="range" id="fSmooth" min="0" max="1" step="0.01" value="0.55"></div>
      <div class="fader"><div class="label"><label for="fTrail">Trail decay</label><output id="oTrail"></output></div>
        <input type="range" id="fTrail" min="0" max="3" step="0.05" value="1"></div>
    </div>
    <div class="group">
      <div class="label">Drawing</div>
      <div class="seg" role="group" aria-label="Drag tool">
        <button data-tool="draw" aria-pressed="true">Draw</button>
        <button data-tool="erase" aria-pressed="false">Erase</button>
      </div>
      <div class="toggle-row">
        <span id="fadeLbl">Fade links after 5s</span>
        <button class="switch" id="fadeSw" role="switch" aria-checked="false" aria-labelledby="fadeLbl"></button>
      </div>
      <div class="row3">
        <button class="btn" id="bRandom">Random</button>
        <button class="btn" id="bLattice">Lattice</button>
        <button class="btn" id="bClear">Clear</button>
      </div>
      <p class="hint">Hover to merge, click for a ripple, drag to draw links. Hold <kbd>Shift</kbd> to swap tools.</p>
    </div>
    <div class="group">
      <div class="label">Shape</div>
      <div class="fader"><div class="label"><label for="fSpacing">Spacing</label><output id="oSpacing"></output></div>
        <input type="range" id="fSpacing" min="16" max="90" step="1" value="40"></div>
      <div class="fader"><div class="label"><label for="fSize">Dot size</label><output id="oSize"></output></div>
        <input type="range" id="fSize" min="0.28" max="0.62" step="0.01" value="0.47"></div>
      <div class="fader"><div class="label"><label for="fGoo">Goo</label><output id="oGoo"></output></div>
        <input type="range" id="fGoo" min="0" max="1" step="0.01" value="0.79"></div>
      <div class="fader"><div class="label"><label for="fMin">Min neck</label><output id="oMin"></output></div>
        <input type="range" id="fMin" min="0.2" max="1" step="0.01" value="0.62"></div>
    </div>
  </div>
</section>
<div class="readout" id="readout"></div>

<script>
(() => {
const PALETTES = [
  {name:"Dusk",  bg:"#1f2a44", fg:"#ffb38a", accent:"#ffb38a", accentInk:"#1f2a44"},
  {name:"Paper", bg:"#ece8df", fg:"#22252b", accent:"#e9ff70", accentInk:"#22252b"},
  {name:"Moss",  bg:"#2e3b2f", fg:"#d6f07a", accent:"#d6f07a", accentInk:"#2e3b2f"},
];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const S = {pal:0,reach:2.2,smooth:.55,trail:1,spacing:40,size:.47,goo:.79,minNeck:.62,tool:"draw",fade:false,
  fx:{magnet:true,ripples:true,breathe:false}};

const canvas = document.getElementById("stage");
const gl = canvas.getContext("webgl2",{antialias:false});
if(!gl){document.body.insertAdjacentHTML("beforeend",'<p style="color:#fff;text-align:center;margin-top:40vh">Needs WebGL2.</p>');return;}

// Dots sit on even-parity lattice points (i+j even). Cell (i,j) owns ONE diagonal joining its two even corners,
// so every dot has 4 diagonal neighbours. State texture, one texel per cell:
// r = link strength E (stored as (E+.25)/1.5), g = dot swell, b/a = dot offset (+-.5).
const FS = `#version 300 es
precision highp float;
uniform sampler2D uS; uniform ivec2 uN; uniform vec2 uO;
uniform float uSc,uH,uR,uNeck,uK,uKb,uMin,uT;
uniform vec3 uBg,uFg;
out vec4 o;
// Cubic smooth-min (C2): the "goo". k = blend radius.
void U(inout float d,float d2,float k){ float h=max(k-abs(d-d2),0.)/k; d=min(d,d2)-h*h*h*k/6.; }
float seg(vec2 p,vec2 a,vec2 b){ vec2 pa=p-a,ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h); }
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
bool inb(ivec2 q){ return q.x>=0&&q.y>=0&&q.x<uN.x&&q.y<uN.y; }
vec2 pos(ivec2 q){ return inb(q)? vec2(q)+(texelFetch(uS,q,0).ba-.5) : vec2(q); }
void main(){
  vec2 p=(vec2(gl_FragCoord.x,uH-gl_FragCoord.y)-uO)/uSc;   // pixel -> lattice units
  ivec2 c=ivec2(floor(p)); float d=1e3;
  for(int y=-2;y<=3;y++) for(int x=-2;x<=3;x++){             // dots
    ivec2 q=c+ivec2(x,y);
    if(!inb(q)||((q.x+q.y)&1)!=0||length(p-vec2(q))>1.65) continue;
    vec4 s=texelFetch(uS,q,0);
    U(d,length(p-(vec2(q)+s.ba-.5))-uR*(1.+.2*s.g),.03+uKb*s.g);
  }
  for(int y=-2;y<=2;y++) for(int x=-2;x<=2;x++){             // links
    ivec2 q=c+ivec2(x,y);
    if(!inb(q)||length(p-vec2(q)-.5)>2.1) continue;
    float e=texelFetch(uS,q,0).r*1.5-.25; if(e<.004) continue;
    ivec2 a,b; if(((q.x+q.y)&1)==0){a=q;b=q+ivec2(1,1);}else{a=q+ivec2(0,1);b=q+ivec2(1,0);}
    vec2 pa=pos(a),pb=pos(b); float full=uNeck*uR,base=uMin*full;
    if(e>=.5){ float s=(e-.5)/.5; U(d,seg(p,pa,pb)-mix(base,full,s),mix(uK*.85,uK,s)); }   // joined neck thickens
    else { float s=e/.5,L=.5*s*(2.-s),g=smoothstep(0.,.42,s);                               // two stubs grow and meet
      U(d,min(seg(p,pa,mix(pa,pb,L)),seg(p,pb,mix(pb,pa,L)))-base*mix(.7,1.,s),mix(.015,uK*.85,g)); }
  }
  float aa=.9/uSc;
  vec3 col=mix(uBg,uFg,smoothstep(aa,-aa,d));
  col+=(hash(gl_FragCoord.xy+fract(uT*7.)*311.)-.5)*.06;     // film grain
  o=vec4(col,1.);
}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,`#version 300 es
in vec2 a; void main(){ gl_Position=vec4(a,0.,1.); }`));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const aLoc=gl.getAttribLocation(prog,"a");gl.enableVertexAttribArray(aLoc);gl.vertexAttribPointer(aLoc,2,gl.FLOAT,false,0,0);
const U={};["uS","uN","uO","uSc","uH","uR","uNeck","uK","uKb","uMin","uT","uBg","uFg"].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,p,gl.NEAREST));
gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);gl.uniform1i(U.uS,0);

let dpr=1,cw=0,ch=0,sc=1,N=[0,0],O=[0,0],E,V,H,JN,B,BH,OX,OY,VX,VY,drawn,born,buf,dirty=4;
function build(){
  const old=drawn?{N:N.slice(),drawn}:null;
  dpr=Math.min(devicePixelRatio||1,1.5);
  cw=canvas.width=Math.max(1,Math.round(innerWidth*dpr)); ch=canvas.height=Math.max(1,Math.round(innerHeight*dpr));
  sc=S.spacing*dpr; N=[Math.ceil(cw/sc)+4,Math.ceil(ch/sc)+4]; O=[(cw-(N[0]-1)*sc)/2,(ch-(N[1]-1)*sc)/2];
  const n=N[0]*N[1],F=()=>new Float32Array(n);
  E=F();V=F();H=F();B=F();BH=F();OX=F();OY=F();VX=F();VY=F();JN=new Uint8Array(n);drawn=new Uint8Array(n);born=new Float64Array(n);buf=new Uint8Array(n*4);
  if(old){ // keep drawn links centred across resizes (shift by an even amount so parity holds)
    let di=Math.floor((N[0]-old.N[0])/2),dj=Math.floor((N[1]-old.N[1])/2);if((di+dj)&1)dj++;
    for(let j=0;j<old.N[1];j++)for(let i=0;i<old.N[0];i++){const ni=i+di,nj=j+dj;
      if(ni>=0&&nj>=0&&ni<N[0]&&nj<N[1]&&old.drawn[j*old.N[0]+i]){const k=nj*N[0]+ni;drawn[k]=1;E[k]=1;born[k]=performance.now();}}
  }
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,N[0],N[1],0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.viewport(0,0,cw,ch);dirty=4;
}

// ---- Pointer ----
const ptr={x:-99,y:-99,sx:-99,sy:-99,in:false,sIn:false,amt:0,down:false,lx:0,ly:0,moved:0,shift:false};
const ripples=[];
const toLattice=e=>{const r=canvas.getBoundingClientRect();return[((e.clientX-r.left)*dpr-O[0])/sc,((e.clientY-r.top)*dpr-O[1])/sc];};
function paintAt(x,y,val){ // hit-test the cell's own diagonal
  const i=Math.floor(x),j=Math.floor(y);if(i<0||j<0||i>=N[0]||j>=N[1])return;
  const fx=x-i,fy=y-j,d=((i+j)&1)===0?Math.abs(fx-fy):Math.abs(fx+fy-1);
  if(d/Math.SQRT2<.3){const k=j*N[0]+i;drawn[k]=val;born[k]=val?performance.now():0;}
}
function paintSeg(x0,y0,x1,y1){
  const val=(S.tool==="draw")!==ptr.shift?1:0,n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/.15));
  for(let s=0;s<=n;s++)paintAt(x0+(x1-x0)*s/n,y0+(y1-y0)*s/n,val);
}
canvas.addEventListener("pointermove",e=>{const [x,y]=toLattice(e);ptr.x=x;ptr.y=y;ptr.in=true;ptr.shift=e.shiftKey;
  if(ptr.down){ptr.moved+=Math.hypot(x-ptr.lx,y-ptr.ly);if(ptr.moved>.35)paintSeg(ptr.lx,ptr.ly,x,y);ptr.lx=x;ptr.ly=y;}});
canvas.addEventListener("pointerdown",e=>{if(e.button!==0)return;canvas.setPointerCapture(e.pointerId);
  const [x,y]=toLattice(e);Object.assign(ptr,{x,y,in:true,down:true,lx:x,ly:y,moved:0,shift:e.shiftKey});
  if(S.fx.ripples)ripples.push({x,y,t:performance.now()});});
const up=e=>{if(ptr.down&&ptr.moved<=.35)paintSeg(ptr.lx,ptr.ly,ptr.lx,ptr.ly);ptr.down=false;if(e.pointerType!=="mouse")ptr.in=false;};
canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);
canvas.addEventListener("pointerleave",()=>{if(!ptr.down)ptr.in=false;});
const syncShift=e=>{ptr.shift=e.shiftKey;canvas.classList.toggle("erasing",(S.tool==="erase")!==ptr.shift);};
addEventListener("keydown",syncShift);addEventListener("keyup",syncShift);

// ---- Simulation ----
const sstep=h=>h<=0?0:h>=1?1:h*h*(3-2*h);
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l>1e-6?((px-ax)*dx+(py-ay)*dy)/l:0;t=t<0?0:t>1?1:t;return Math.hypot(px-ax-dx*t,py-ay-dy*t);}
let last=performance.now(),moving=1,idle=0;
function step(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const f=dt*60,t=now/1000;
  const decay=S.trail>0?Math.exp(-dt/(S.trail*.45)):0,damp=Math.pow(.74+.08*S.smooth,f),odamp=Math.pow(.8,f),stiff=.22-.14*S.smooth;
  // Smoothed cursor; the brush is the segment it travelled this frame, so fast strokes leave no gaps.
  if(ptr.in&&!ptr.sIn){ptr.sx=ptr.x;ptr.sy=ptr.y;}ptr.sIn=ptr.in;
  const ax=ptr.sx,ay=ptr.sy,follow=1-Math.exp(-dt*(42-37*S.smooth));
  if(ptr.in){ptr.sx+=(ptr.x-ptr.sx)*follow;ptr.sy+=(ptr.y-ptr.sy)*follow;}
  ptr.amt+=((ptr.in?1:0)-ptr.amt)*(1-Math.exp(-dt*(14-10*S.smooth)));
  const amt=sstep(ptr.amt),bx=ptr.sx,by=ptr.sy,hov=amt>.002;
  const rv=S.reach*(1+Math.min(.6,Math.hypot(bx-ax,by-ay)/Math.max(dt,.001)*.02));
  for(let r=ripples.length-1;r>=0;r--)if(now-ripples[r].t>2400)ripples.splice(r,1);
  let mv=hov||ripples.length||S.fx.breathe?1:0;
  const nx=N[0],ny=N[1],life=S.fade?5000:Infinity;
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
    const k=j*nx+i,even=((i+j)&1)===0;
    if(drawn[k]&&now-born[k]>life)drawn[k]=0;
    let tg=drawn[k]?1:0;
    const h=hov?sstep(1-Math.max(0,segDist(i+.5,j+.5,ax,ay,bx,by)-.25)/rv)*amt:0;
    H[k]=Math.max(h,H[k]*decay);if(H[k]>tg)tg=H[k];
    let rip=0,rdx=0,rdy=0;
    for(const R of ripples){const age=(now-R.t)/1000,dx=i+.5-R.x,dy=j+.5-R.y,d=Math.hypot(dx,dy);
      const w=sstep(1-Math.abs(d-age*8)/1.1)*(1-age/2.4);if(w>rip){rip=w;rdx=dx/(d||1);rdy=dy/(d||1);}}
    if(rip>tg)tg=rip;
    // Magnetic join with hysteresis: snap together past .42, let go only below .2. Never rests half-joined.
    if(!JN[k]&&tg>.42)JN[k]=1;else if(JN[k]&&tg<.2)JN[k]=0;
    tg=JN[k]?.62+.38*sstep((tg-.2)/.8):.16*sstep(tg/.42);
    if(reduce){E[k]+=(tg-E[k])*Math.min(1,.25*f);}
    else if(tg>=E[k]){V[k]+=(tg-E[k])*stiff*f;V[k]*=damp;E[k]+=V[k]*f;}        // springy attach (overshoot = wobble)
    else{V[k]*=Math.pow(.55,f);const rate=(E[k]>.5?6.5:2.6)*(1.35-.7*S.smooth);   // calm release, no bounce
      E[k]+=(tg-E[k])*(1-Math.exp(-dt*rate))+V[k]*f;if(E[k]<tg)E[k]=tg;}
    if(Math.abs(E[k]-tg)>1e-3||Math.abs(V[k])>1e-4)mv=1;
    if(even){ // dot: swell + magnet offset
      const bt=hov?sstep(1-segDist(i,j,ax,ay,bx,by)/(rv*.85))*amt:0;
      BH[k]=Math.max(bt,BH[k]*decay);
      let bump=Math.max(BH[k],rip*.8);if(S.fx.breathe)bump=Math.max(bump,.18*(.5+.5*Math.sin(t*1.3+i*.45+j*.31)));
      B[k]+=(bump-B[k])*Math.min(1,.2*f);
      let gx=0,gy=0;
      if(S.fx.magnet&&hov){const dx=bx-i,dy=by-j,d=Math.hypot(dx,dy),w=sstep(1-d/(S.reach*1.4))*amt;
        if(w>0){const s=.24*w/Math.max(d,.7);gx+=dx*s;gy+=dy*s;}}
      gx+=rdx*.16*rip;gy+=rdy*.16*rip;
      if(S.fx.breathe){gx+=.035*Math.sin(t*.9+j*.6);gy+=.035*Math.cos(t*.8+i*.5);}
      VX[k]+=(gx-OX[k])*.12*f;VY[k]+=(gy-OY[k])*.12*f;VX[k]*=odamp;VY[k]*=odamp;OX[k]+=VX[k]*f;OY[k]+=VY[k]*f;
      OX[k]=Math.max(-.45,Math.min(.45,OX[k]));OY[k]=Math.max(-.45,Math.min(.45,OY[k]));
      if(Math.abs(VX[k])+Math.abs(VY[k])>1e-4||Math.abs(bump-B[k])>3e-4)mv=1;
    }
    const o=k*4;
    buf[o]=Math.max(0,Math.min(255,Math.round((E[k]+.25)/1.5*255)));
    buf[o+1]=Math.round(Math.min(1,B[k])*255);buf[o+2]=Math.round((OX[k]+.5)*255);buf[o+3]=Math.round((OY[k]+.5)*255);
  }
  moving=mv;
}
function hex(h){const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];}
function render(now){
  const p=PALETTES[S.pal];
  gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,N[0],N[1],gl.RGBA,gl.UNSIGNED_BYTE,buf);
  gl.uniform2i(U.uN,N[0],N[1]);gl.uniform2f(U.uO,O[0],O[1]);gl.uniform1f(U.uSc,sc);gl.uniform1f(U.uH,ch);
  gl.uniform1f(U.uR,S.size);gl.uniform1f(U.uNeck,.3+.75*S.goo);gl.uniform1f(U.uK,.12+.42*S.goo);gl.uniform1f(U.uKb,.06+.3*S.goo);
  gl.uniform1f(U.uMin,S.minNeck);gl.uniform1f(U.uT,now/1000);gl.uniform3fv(U.uBg,hex(p.bg));gl.uniform3fv(U.uFg,hex(p.fg));
  gl.drawArrays(gl.TRIANGLES,0,3);
}
let frame=0;
function loop(now){
  // Idle: keep the last frame, tick the sim at 1/4 rate while nothing moves and the cursor is away.
  if(!(idle>30&&!ptr.in)||frame%4===0){
    step(now);
    if(moving||dirty>0){idle=0;render(now);if(dirty>0)dirty--;}else idle++;
  }
  if((frame++&15)===0){let c=0;for(const v of drawn)c+=v;document.getElementById("readout").textContent=`${N[0]} × ${N[1]} grid · ${c} link${c===1?"":"s"}`;}
  requestAnimationFrame(loop);
}

// ---- Presets ----
function setCell(i,j){if(i>=0&&j>=0&&i<N[0]&&j<N[1]){const k=j*N[0]+i;drawn[k]=1;born[k]=performance.now();}}
function presetRandom(){drawn.fill(0);
  for(let c=0,n=Math.round(N[0]*N[1]/16);c<n;c++){let x=Math.floor(Math.random()*N[0]),y=Math.floor(Math.random()*N[1]);if((x+y)&1)x++;
    let dx=Math.random()<.5?1:-1,dy=Math.random()<.5?1:-1;
    for(let s=0,len=2+Math.floor(Math.random()*6);s<len;s++){if(Math.random()<.35)dy=-dy;setCell(Math.min(x,x+dx),Math.min(y,y+dy));x+=dx;y+=dy;}}}
function presetLattice(){drawn.fill(0);for(let j=0;j<N[1];j+=2)for(let i=0;i<N[0];i++)if(i%4<2)setCell(i,j+(i%2));}

// ---- Controls ----
function applyPalette(i){
  S.pal=i;const p=PALETTES[i],r=document.documentElement.style;
  r.setProperty("--bg",p.bg);r.setProperty("--fg",p.fg);r.setProperty("--accent",p.accent);r.setProperty("--accent-ink",p.accentInk);
  document.getElementById("palName").textContent=p.name;
  document.querySelectorAll(".swatch").forEach((b,k)=>b.setAttribute("aria-pressed",k===i));dirty=4;
}
const sw=document.getElementById("swatches");
PALETTES.forEach((p,i)=>{const b=document.createElement("button");b.className="swatch";b.title=b.ariaLabel=p.name;
  b.style.setProperty("--sbg",p.bg);b.style.setProperty("--sfg",p.fg);b.onclick=()=>applyPalette(i);sw.appendChild(b);});
// fader(id, key, format, onChange): binds <input id="f{id}"> to S[key], prints into <output id="o{id}">, paints the track fill via --p.
function fader(id,key,fmt,onChange){
  const el=document.getElementById("f"+id),out=document.getElementById("o"+id);
  const upd=()=>{S[key]=parseFloat(el.value);out.textContent=fmt(S[key]);el.style.setProperty("--p",(el.value-el.min)/(el.max-el.min)*100+"%");onChange&&onChange();};
  el.addEventListener("input",upd);upd();
}
fader("Reach","reach",v=>v.toFixed(1)+" u");
fader("Smooth","smooth",v=>Math.round(v*100)+"%");
fader("Trail","trail",v=>v===0?"off":v.toFixed(2)+" s");
fader("Spacing","spacing",v=>v+" px",()=>{if(E)build();});
fader("Size","size",v=>"r "+v.toFixed(2)+" u");
fader("Goo","goo",v=>Math.round(v*100)+"%");
fader("Min","minNeck",v=>Math.round(v*100)+"%");
document.querySelectorAll(".chip[data-fx]").forEach(b=>{const k=b.dataset.fx;b.setAttribute("aria-pressed",S.fx[k]);
  b.onclick=()=>{S.fx[k]=!S.fx[k];b.setAttribute("aria-pressed",S.fx[k]);};});
document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{S.tool=b.dataset.tool;
  document.querySelectorAll("[data-tool]").forEach(x=>x.setAttribute("aria-pressed",x===b));canvas.classList.toggle("erasing",S.tool==="erase");});
const fadeSw=document.getElementById("fadeSw");
fadeSw.onclick=()=>{S.fade=!S.fade;fadeSw.setAttribute("aria-checked",S.fade);if(S.fade)born.fill(performance.now());};
document.getElementById("bRandom").onclick=presetRandom;
document.getElementById("bLattice").onclick=presetLattice;
document.getElementById("bClear").onclick=()=>drawn.fill(0);
const mod=document.getElementById("module"),col=document.getElementById("collapse");
function setOpen(o){mod.classList.toggle("closed",!o);col.textContent=o?"Hide":"Controls";col.setAttribute("aria-expanded",o);}
col.onclick=()=>setOpen(mod.classList.contains("closed"));
if(matchMedia("(max-width:640px)").matches)setOpen(false);
mod.addEventListener("input",()=>dirty=4);mod.addEventListener("click",()=>dirty=4);
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(build,80);});

applyPalette(0);build();presetRandom();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
